<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Ankilot風 暗記テスト</title>
  <style>
    body {
      font-family: "Helvetica Neue", sans-serif;
      background: linear-gradient(135deg, #eef2ff, #fdfdfd);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      background: white;
      width: 360px;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .question {
      font-size: 22px;
      text-align: center;
      margin-bottom: 16px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .result {
      text-align: center;
      margin-top: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .correct {
      color: #16a34a;
    }

    .wrong {
      color: #dc2626;
    }

    .next {
      margin-top: 10px;
      background: #6b7280;
    }
  </style>
</head>
<body>

<div class="app">
  <h1>Ankilot風</h1>

  <div class="question" id="question"></div>

  <input type="text" id="answer" placeholder="答えを入力">

  <button onclick="checkAnswer()">答え合わせ</button>

  <div class="result" id="result"></div>

  <button class="next" onclick="nextQuestion()">次の問題</button>
</div>

<script>
  const questions = [
    { q: "apple", a: "りんご" },
    { q: "dog", a: "犬" },
    { q: "water", a: "水" }
  ];

  let index = 0;

  const questionEl = document.getElementById("question");
  const answerEl = document.getElementById("answer");
  const resultEl = document.getElementById("result");

  function showQuestion() {
    questionEl.textContent = questions[index].q;
    answerEl.value = "";
    resultEl.textContent = "";
    resultEl.className = "result";
  }

  function checkAnswer() {
    const userAnswer = answerEl.value.trim();
    const correct = questions[index].a;

    if (!userAnswer) return;

    if (userAnswer === correct) {
      resultEl.textContent = "正解！🎉";
      resultEl.classList.add("correct");
    } else {
      resultEl.textContent = `不正解… 正解：${correct}`;
      resultEl.classList.add("wrong");
    }
  }

  function nextQuestion() {
    index = (index + 1) % questions.length;
    showQuestion();
  }

  showQuestion();
</script>

</body>
</html>

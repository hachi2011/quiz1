<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Ankilot風 単語帳</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: sans-serif;
  background: #eef2ff;
  display: flex;
  justify-content: center;
  padding: 40px;
}

.app {
  width: 420px;
  background: white;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

h2 { text-align: center; margin-top: 0; }

input, select, button {
  width: 100%;
  padding: 8px;
  margin: 6px 0;
  font-size: 15px;
}

button {
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #4f46e5;
  color: white;
}

.secondary { background: #6b7280; }
.hidden { display: none; }

.card {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin: 16px 0;
}

.result { text-align: center; font-weight: bold; }
.correct { color: #16a34a; }
.wrong { color: #dc2626; }
</style>
</head>

<body>
<div class="app">

<!-- メニュー -->
<div id="menu">
  <h2>公開単語帳</h2>
  <select id="deckSelect"></select>
  <button onclick="startTest()">暗記を始める</button>
  <button class="secondary" onclick="showCreate()">単語帳を作成</button>
</div>

<!-- テスト -->
<div id="test" class="hidden">
  <h2 id="deckTitle"></h2>
  <div class="card" id="question"></div>
  <input id="answer" placeholder="答えを入力">
  <button id="checkBtn">答え合わせ（Enter）</button>
  <button id="nextBtn" class="secondary hidden">次の問題（Enter）</button>
  <div id="result" class="result"></div>
  <button class="secondary" onclick="back()">戻る</button>
</div>

<!-- 作成 -->
<div id="create" class="hidden">
  <h2>単語帳作成</h2>
  <input id="newName" placeholder="単語帳名">
  <input id="newPass" placeholder="パスワード">
  <button onclick="createDeck()">公開する</button>
  <button class="secondary" onclick="back()">戻る</button>
</div>

</div>

<script>
/* ===== 設定 ===== */
const GAS_URL = "https://script.google.com/macros/s/AKfycbwju3IZmXQsZ9YlEqMCsoevpBpQoLM7z-B3QlNwAtifBLEb9KCO5SoCyQYvnDEY2qfv/exec";

/* ===== 状態 ===== */
let publicDecks = [];
let currentDeck = [];
let index = 0;
let phase = "question";

/* ===== DOM ===== */
const menu = document.getElementById("menu");
const test = document.getElementById("test");
const create = document.getElementById("create");

/* ===== 共通 ===== */
function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}

function show(el) {
  [menu, test, create].forEach(d => d.classList.add("hidden"));
  el.classList.remove("hidden");
}

/* ===== 公開単語帳を取得 ===== */
async function loadDecks() {
  const res = await fetch(GAS_URL);
  publicDecks = await res.json();

  deckSelect.innerHTML = "";
  publicDecks.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d.deckId;
    opt.textContent = d.name;
    deckSelect.appendChild(opt);
  });
}

/* ===== テスト開始 ===== */
function startTest() {
  const id = deckSelect.value;
  const deck = publicDecks.find(d => d.deckId === id);

  currentDeck = shuffle(deck.data);
  index = 0;
  deckTitle.textContent = deck.name;
  showQuestion();
  show(test);
}

function showQuestion() {
  question.textContent = currentDeck[index].q;
  answer.value = "";
  result.textContent = "";
  checkBtn.classList.remove("hidden");
  nextBtn.classList.add("hidden");
  phase = "question";
  answer.focus();
}

function checkAnswer() {
  if (!answer.value) return;
  const correct = currentDeck[index].a;

  if (answer.value.trim() === correct) {
    result.textContent = "正解！🎉";
    result.className = "result correct";
  } else {
    result.textContent = `不正解… 正解：${correct}`;
    result.className = "result wrong";
  }

  checkBtn.classList.add("hidden");
  nextBtn.classList.remove("hidden");
  phase = "result";
}

function nextQuestion() {
  index = (index + 1) % currentDeck.length;
  showQuestion();
}

/* ===== 作成 ===== */
function showCreate() {
  show(create);
}

async function createDeck() {
  if (!newName.value || !newPass.value) return;

  await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      type: "create",
      name: newName.value,
      password: newPass.value,
      words: []
    })
  });

  alert("単語帳を公開しました");
  newName.value = newPass.value = "";
  await loadDecks();
  show(menu);
}

/* ===== 戻る ===== */
function back() {
  show(menu);
}

/* ===== Enter操作 ===== */
document.addEventListener("keydown", e => {
  if (!test.classList.contains("hidden") && e.key === "Enter") {
    phase === "question" ? checkAnswer() : nextQuestion();
  }
});

/* 初期化 */
loadDecks();
</script>
</body>
</html>

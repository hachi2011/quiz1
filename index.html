<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Ankilot風 暗記テスト</title>
  <style>
    body {
      font-family: sans-serif;
      background: linear-gradient(135deg, #eef2ff, #ffffff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 360px;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .question {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
    }

    .check {
      background: #4f46e5;
    }

    .next {
      background: #6b7280;
    }

    .result {
      text-align: center;
      margin-top: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .correct {
      color: #16a34a;
    }

    .wrong {
      color: #dc2626;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="app">
  <h1>Ankilot風</h1>

  <div class="question" id="question"></div>

  <input type="text" id="answer" placeholder="答えを入力" autofocus>

  <button id="checkBtn" class="check">答え合わせ（Enter）</button>
  <button id="nextBtn" class="next hidden">次の問題（Enter）</button>

  <div class="result" id="result"></div>
</div>

<script>
  const questions = [
    { q: "apple", a: "りんご" },
    { q: "dog", a: "犬" },
    { q: "water", a: "水" }
  ];

  let index = 0;
  let phase = "question"; // question | result

  const questionEl = document.getElementById("question");
  const answerEl = document.getElementById("answer");
  const resultEl = document.getElementById("result");
  const checkBtn = document.getElementById("checkBtn");
  const nextBtn = document.getElementById("nextBtn");

  function showQuestion() {
    questionEl.textContent = questions[index].q;
    answerEl.value = "";
    resultEl.textContent = "";
    resultEl.className = "result";

    checkBtn.classList.remove("hidden");
    nextBtn.classList.add("hidden");
    phase = "question";

    answerEl.focus();
  }

  function checkAnswer() {
    const user = answerEl.value.trim();
    const correct = questions[index].a;

    if (!user) return;

    if (user === correct) {
      resultEl.textContent = "正解！🎉";
      resultEl.classList.add("correct");
    } else {
      resultEl.textContent = `不正解… 正解：${correct}`;
      resultEl.classList.add("wrong");
    }

    checkBtn.classList.add("hidden");
    nextBtn.classList.remove("hidden");
    phase = "result";
  }

  function nextQuestion() {
    index = (index + 1) % questions.length;
    showQuestion();
  }

  // ボタン操作
  checkBtn.onclick = checkAnswer;
  nextBtn.onclick = nextQuestion;

  // Enterキー操作
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      if (phase === "question") {
        checkAnswer();
      } else {
        nextQuestion();
      }
    }
  });

  showQuestion();
</script>

</body>
</html>
